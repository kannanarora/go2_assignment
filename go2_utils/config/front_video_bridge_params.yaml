front_video_bridge_node:
  ros__parameters:
    input_topic: /frontvideostream
    output_topic: /camera/image_raw
    compressed_output_topic: /camera/image_raw/compressed
    frame_id: front_camera
    stream: video720p
    publish_raw: true
    publish_compressed: false
    raw_max_fps: 10.0
    compressed_max_fps: 3.0
    jpeg_quality: 55
    decode_buffer_max_bytes: 1048576
    log_decode_errors: false
