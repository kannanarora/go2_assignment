front_video_bridge_node:
  ros__parameters:
    input_topic: /frontvideostream
    output_topic: /camera/color/image
    compressed_output_topic: /camera/color/image/compressed
    frame_id: front_camera
    stream: video720p
    publish_raw: true
    publish_compressed: true
    raw_max_fps: 10.0
    compressed_max_fps: 3.0
    jpeg_quality: 55
    log_decode_errors: false
    log_first_frame_info: true
