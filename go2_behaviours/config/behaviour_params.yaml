behaviour_planner_node:
  ros__parameters:
    scan_topic: /front_scan
    greeting_min_distance: 1.5
    greeting_distance: 2.5
    safety_clear_distance: 1.2
    front_half_angle_deg: 15.0
    idle_timeout_s: 10.0
    tick_rate_s: 3.0

behaviour_executor_node:
  ros__parameters:
    requested_behaviour_topic: /requested_behaviour
    trigger_behaviour_topic: /trigger_behaviour

safety_monitor_node:
  ros__parameters:
    scan_topic: /front_scan
    safety_override_topic: /safety_override
    trigger_behaviour_topic: /trigger_behaviour
    sit_threshold_m: 0.8
    clear_threshold_m: 1.2
    front_half_angle_deg: 15.0
    required_blocked_frames: 2
    required_clear_frames: 4
    safety_command: sit
    clear_command: rise_sit
    enable_stand_command: true
    log_rate_hz: 2.0
