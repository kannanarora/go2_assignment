behaviour_planner_node:
  ros__parameters:
    planned_behaviour_topic: /planned_behaviour
    auto_publish: false
    default_behaviour: stand
    period_s: 5.0

behaviour_executor_node:
  ros__parameters:
    planned_behaviour_topic: /planned_behaviour
    trigger_behaviour_topic: /trigger_behaviour

safety_monitor_node:
  ros__parameters:
    stop_topic: /safety_stop
    trigger_behaviour_topic: /trigger_behaviour
    safety_command: lie_down

sit_stand_loop_node:
  ros__parameters:
    stand_api_id: 1004
    sit_api_id: 1009
    period_s: 4.0
    start_with_stand: true

wander_node:
  ros__parameters:
    scan_topic: /front_scan
    trigger_topic: /trigger_behaviour
    forward_speed_mps: 0.30
    turn_speed_radps: 0.60
    avoid_turn_speed_radps: 0.75
    min_turn_deg: 25.0
    max_turn_deg: 120.0
    min_walk_distance_m: 0.8
    max_walk_distance_m: 2.0
    avoid_threshold_m: 0.95
    clear_threshold_m: 1.25
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    stop_duration_s: 0.4
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 1.0
    startup_command: balance_stand
