sport_client_wrapper_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    request_topic: /api/sport/request

safety_monitor_node:
  ros__parameters:
    stop_topic: /safety_stop
    trigger_behaviour_topic: /trigger_behaviour
    safety_command: lie_down

sit_stand_loop_node:
  ros__parameters:
    stand_api_id: 1004
    sit_api_id: 1009
    period_s: 4.0
    start_with_stand: true

wander_node:
  ros__parameters:
    trigger_topic: /wander_cmd
    bark_topic: /bark
    forward_speed_mps: 0.66
    turn_speed_radps: 1.26
    min_turn_deg: 35.0
    max_turn_deg: 160.0
    min_walk_distance_m: 1.2
    max_walk_distance_m: 3.5
    stop_duration_s: 0.4
    trick_duration_s: 5.0
    command_rate_hz: 10.0
    log_rate_hz: 0.0
    startup_command: balance_stand

obstacle_avoid_node:
  ros__parameters:
    scan_topic: /front_scan
    command_topic: /avoidance_cmd
    turn_speed_radps: 1.26
    avoid_turn_speed_radps: 1.35
    avoid_threshold_m: 1.45
    clear_threshold_m: 1.75
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_extra_turn_deg: 18.0
    max_avoid_turn_s: 8.0
    stop_duration_s: 0.4
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 0.0

approach_person_node:
  ros__parameters:
    person_track_topic: /person_track
    scan_topic: /front_scan
    trigger_topic: /trigger_behaviour
    cmd_vel_topic: /cmd_vel
    stop_distance_m: 0.75
    distance_tolerance_m: 0.08
    forward_speed_mps: 0.25
    min_forward_speed_mps: 0.08
    approach_slowdown_distance_m: 0.45
    min_bearing_speed_scale: 0.45
    search_yaw_speed_radps: 0.45
    max_yaw_speed_radps: 0.55
    yaw_kp: 1.2
    yaw_sign: 1.0
    centered_bearing_rad: 0.08
    turn_in_place_bearing_rad: 0.40
    min_person_confidence: 0.40
    confirm_person_s: 0.35
    arrival_confirm_s: 0.45
    arrival_centered_bearing_rad: 0.16
    person_obstacle_bearing_gate_rad: 0.35
    person_obstacle_distance_tolerance_m: 0.35
    centered_front_is_person_max_distance_m: 2.5
    obstacle_stop_distance_m: 0.65
    obstacle_clear_distance_m: 0.90
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_yaw_speed_radps: 0.35
    max_avoid_s: 2.0
    person_timeout_s: 0.8
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 1.0
    startup_command: balance_stand
    arrival_command: sit
    arrival_command_repeats: 5
    arrival_command_period_s: 0.25

voice_command_mapper_node:
  ros__parameters:
    text_topic: /go2/whisper/text
    command_topic: /trick_cmd
    cooldown_sec: 2.0
    fuzzy_threshold: 0.8
    forward_speed_mps: 0.66
    turn_speed_radps: 1.26
    trick_hold_sec: 0.6
    move_duration_sec: 2.0
    turn_duration_sec: 1.0
    command_rate_hz: 10.0

sound_player_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    sound_map:
      - bark:go2_bark
      - speak:go2_bark
      - bark2:go2_bark2
      - bark3:go2_bark3
      - breathe:go2_breathing
      - cry:go2_crying
      - pant:go2_panting1
      - pant2:go2_panting2
      - pant3:go2_panting3

random_bark_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    bark_token: bark
    min_interval_s: 8.0
    max_interval_s: 30.0
