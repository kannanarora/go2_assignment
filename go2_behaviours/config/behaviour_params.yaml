behaviour_planner_node:
  ros__parameters:
    scan_topic: /front_scan
    greeting_min_distance: 1.8
    greeting_distance: 2.3
    safety_clear_distance: 1.2
    front_half_angle_deg: 15.0
    tick_rate_s: 3.0
    hello_confirm_ticks: 2
    hello_cooldown_s: 12.0
    voice_topic: /go2/whisper/text

behaviour_executor_node:
  ros__parameters:
    requested_behaviour_topic: /requested_behaviour
    trigger_behaviour_topic: /trigger_behaviour
    wander_pause_topic: /wander_pause

sport_client_wrapper_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    request_topic: /api/sport/request

safety_monitor_node:
  ros__parameters:
    scan_topic: /front_scan
    safety_override_topic: /safety_override
    trigger_behaviour_topic: /trigger_behaviour
    sit_threshold_m: 0.8
    clear_threshold_m: 1.2
    front_half_angle_deg: 15.0
    required_blocked_frames: 5
    required_clear_frames: 30
    safety_command: sit
    clear_command: rise_sit
    enable_stand_command: true
    self_ignore_distance_m: 0.68
    recovery_clear_threshold_m: 1.45
    recovery_window_frames: 15
    min_sit_hold_s: 3.0
    log_rate_hz: 2.0

wander_node:
  ros__parameters:
    scan_topic: /front_scan
    trigger_topic: /trigger_behaviour
    cmd_vel_topic: /cmd_vel
    safety_override_topic: /safety_override
    wander_pause_topic: /wander_pause
    forward_speed_mps: 0.66
    turn_speed_radps: 1.26
    avoid_turn_speed_radps: 1.35
    min_turn_deg: 35.0
    max_turn_deg: 160.0
    min_walk_distance_m: 1.2
    max_walk_distance_m: 3.5
    avoid_threshold_m: 1.45
    clear_threshold_m: 1.75
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_extra_turn_deg: 18.0
    max_avoid_turn_s: 8.0
    stop_duration_s: 0.4
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 0.0
    startup_command: balance_stand
