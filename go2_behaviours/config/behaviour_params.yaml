behaviour_planner_node:
  ros__parameters:
    scan_topic: /front_scan
    greeting_distance: 2.0
    idle_timeout_s: 10.0
    tick_rate_s: 3.0

behaviour_executor_node:
  ros__parameters:
    planned_behaviour_topic: /planned_behaviour
    trigger_behaviour_topic: /trigger_behaviour

safety_monitor_node:
  ros__parameters:
    scan_topic: /front_scan
    safety_override_topic: /safety_override
    trigger_behaviour_topic: /trigger_behaviour
    trigger_threshold_m: 0.15
    clear_threshold_m: 0.20
    safety_command: sit
    clear_command: rise_sit

pointcloud_to_laserscan_node:
  ros__parameters:
    cloud_topic: /utlidar/cloud_deskewed

sit_stand_loop_node:
  ros__parameters:
    stand_api_id: 1004
    sit_api_id: 1009
    period_s: 4.0
    start_with_stand: true
