behaviour_planner_node:
  ros__parameters:
    planned_behaviour_topic: /planned_behaviour
    auto_publish: false
    default_behaviour: stand
    period_s: 5.0

behaviour_executor_node:
  ros__parameters:
    planned_behaviour_topic: /planned_behaviour
    trigger_behaviour_topic: /trigger_behaviour

sport_client_wrapper_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    request_topic: /api/sport/request

safety_monitor_node:
  ros__parameters:
    stop_topic: /safety_stop
    trigger_behaviour_topic: /trigger_behaviour
    safety_command: lie_down

sit_stand_loop_node:
  ros__parameters:
    stand_api_id: 1004
    sit_api_id: 1009
    period_s: 4.0
    start_with_stand: true

wander_node:
  ros__parameters:
    scan_topic: /front_scan
    trigger_topic: /trigger_behaviour
    cmd_vel_topic: /cmd_vel
    forward_speed_mps: 0.66
    turn_speed_radps: 1.26
    avoid_turn_speed_radps: 1.35
    min_turn_deg: 35.0
    max_turn_deg: 160.0
    min_walk_distance_m: 1.2
    max_walk_distance_m: 3.5
    avoid_threshold_m: 1.45
    clear_threshold_m: 1.75
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_extra_turn_deg: 18.0
    max_avoid_turn_s: 8.0
    stop_duration_s: 0.4
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 0.0
    startup_command: balance_stand

approach_person_node:
  ros__parameters:
    person_track_topic: /person_track
    scan_topic: /front_scan
    trigger_topic: /trigger_behaviour
    cmd_vel_topic: /cmd_vel
    stop_distance_m: 1.0
    distance_tolerance_m: 0.08
    forward_speed_mps: 0.25
    min_forward_speed_mps: 0.08
    search_yaw_speed_radps: 0.65
    max_yaw_speed_radps: 0.85
    yaw_kp: 1.6
    yaw_sign: -1.0
    centered_bearing_rad: 0.08
    turn_in_place_bearing_rad: 0.40
    min_person_confidence: 0.40
    confirm_person_s: 0.35
    arrival_confirm_s: 0.45
    arrival_centered_bearing_rad: 0.16
    obstacle_stop_distance_m: 0.75
    obstacle_clear_distance_m: 1.05
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_yaw_speed_radps: 0.65
    max_avoid_s: 5.0
    person_timeout_s: 0.8
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 1.0
    startup_command: balance_stand
    arrival_command: sit
    arrival_command_repeats: 5
    arrival_command_period_s: 0.25
