sport_client_wrapper_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    request_topic: /api/sport/request

safety_monitor_node:
  ros__parameters:
    stop_topic: /safety_stop
    trigger_behaviour_topic: /trigger_behaviour
    safety_command: lie_down

sit_stand_loop_node:
  ros__parameters:
    stand_api_id: 1004
    sit_api_id: 1009
    period_s: 4.0
    start_with_stand: true

wander_node:
  ros__parameters:
    trigger_topic: /wander_cmd
    bark_topic: /bark
    forward_speed_mps: 0.30
    turn_speed_radps: 1.00
    min_turn_deg: 35.0
    max_turn_deg: 160.0
    min_walk_distance_m: 1.2
    max_walk_distance_m: 3.5
    stop_duration_s: 0.4
    trick_duration_s: 5.0
    command_rate_hz: 10.0
    log_rate_hz: 0.0
    startup_command: balance_stand

obstacle_avoid_node:
  ros__parameters:
    scan_topic: /front_scan
    command_topic: /avoidance_cmd
    turn_speed_radps: 1.00
    avoid_turn_speed_radps: 1.10
    avoid_threshold_m: 1.00
    clear_threshold_m: 1.25
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_extra_turn_deg: 18.0
    max_avoid_turn_s: 8.0
    stop_duration_s: 0.4
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 0.0

avoid_people_node:
  ros__parameters:
    person_track_topic: /person_track
    command_topic: /avoid_people_cmd
    sit_distance_m: 1.00
    clear_distance_m: 1.15
    min_person_confidence: 0.30
    confirm_near_s: 0.15
    lost_person_grace_s: 0.8
    command_rate_hz: 5.0
    log_rate_hz: 1.0
    sit_command: sit
    use_tracker_nearby_fallback: true

approach_person_node:
  ros__parameters:
    person_track_topic: /person_track
    scan_topic: /front_scan
    command_topic: /approach_cmd
    trigger_topic: /approach_trigger
    stop_distance_m: 1.10
    distance_tolerance_m: 0.10
    forward_speed_mps: 0.42
    min_forward_speed_mps: 0.26
    approach_slowdown_distance_m: 0.30
    min_bearing_speed_scale: 0.50
    search_yaw_speed_radps: 0.55
    max_yaw_speed_radps: 0.55
    max_walk_yaw_speed_radps: 0.18
    yaw_kp: 0.90
    yaw_sign: 1.0
    centered_bearing_rad: 0.18
    walk_with_turn_bearing_rad: 0.35
    turn_in_place_bearing_rad: 0.60
    min_person_confidence: 0.40
    confirm_person_s: 0.35
    arrival_confirm_s: 0.45
    arrival_centered_bearing_rad: 0.25
    person_obstacle_bearing_gate_rad: 0.35
    person_obstacle_distance_tolerance_m: 0.35
    centered_front_is_person_max_distance_m: 2.5
    obstacle_stop_distance_m: 0.65
    obstacle_clear_distance_m: 0.90
    front_half_angle_deg: 18.0
    side_sector_min_deg: 25.0
    side_sector_max_deg: 80.0
    avoid_yaw_speed_radps: 0.35
    max_avoid_s: 2.0
    person_timeout_s: 0.8
    distance_memory_s: 0.7
    scan_timeout_s: 1.5
    command_rate_hz: 10.0
    log_rate_hz: 1.0
    active_on_start: false
    max_search_s: 8.0
    max_behaviour_s: 25.0
    startup_command: balance_stand
    arrival_command: sit
    arrival_command_repeats: 5
    arrival_command_period_s: 0.25

voice_command_mapper_node:
  ros__parameters:
    text_topic: /go2/whisper/text
    command_topic: /trick_cmd
    approach_trigger_topic: /approach_trigger
    cooldown_sec: 2.0
    fuzzy_threshold: 0.8
    forward_speed_mps: 0.50
    turn_speed_radps: 1.00
    trick_hold_sec: 0.6
    move_duration_sec: 2.0
    turn_duration_sec: 1.0
    command_rate_hz: 10.0

sound_player_node:
  ros__parameters:
    trigger_topic: /trigger_behaviour
    sound_map:
      - bark:bark
      - speak:bark
      - dance:bark2
      - sit:bark
      - lie_down:crying1
      - hello:bark
      - stretch:stretch1

random_bark_node:
  ros__parameters:
    trigger_topic: /dog_sound_trigger
    bark_token: bark
    min_interval_s: 8.0
    max_interval_s: 18.0
